<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login — PROJOYSTICK</title>

    <link
        rel="stylesheet"
        href="../css/auth.css"
    >

</head>


<body>

    <main class="auth-page">

        <section class="auth-container">


            <!-- BRAND -->

            <a
                href="#"
                class="auth-logo"
                id="authLogo"
            >

                <span>◆</span>
                PRO<span>JOYSTICK</span>

            </a>


            <!-- CARD -->

            <div class="auth-card">


                <!-- HEADER -->

                <div class="auth-header">

                    <span class="auth-label">
                        WELCOME BACK
                    </span>

                    <h1>
                        Login to your account
                    </h1>

                    <p>
                        Continue your gaming journey.
                    </p>

                </div>


                <!-- ERROR / SUCCESS -->

                <div
                    id="authMessage"
                    class="auth-message"
                ></div>


                <!-- LOGIN FORM -->

                <form id="loginForm">


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <div class="password-label">

                            <label for="password">
                                Password
                            </label>

                            <a
                                href="#"
                                id="forgotPassword"
                            >
                                Forgot password?
                            </a>

                        </div>


                        <div class="password-input">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                type="button"
                                class="show-password"
                                data-target="password"
                            >
                                Show
                            </button>

                        </div>

                    </div>


                    <!-- LOGIN BUTTON -->

                    <button
                        type="submit"
                        class="auth-submit"
                        id="loginButton"
                    >
                        Login
                    </button>

                </form>


                <!-- DIVIDER -->

                <div class="auth-divider">

                    <span>OR</span>

                </div>


                <!-- GOOGLE LOGIN -->

                <button
                    type="button"
                    class="google-btn"
                    id="googleLogin"
                >

                    <span class="google-icon">
                        G
                    </span>

                    Continue with Google

                </button>


                <!-- REGISTER -->

                <p class="auth-switch">

                    Don't have an account?

                    <a href="register.html">
                        Create one
                    </a>

                </p>

            </div>


            <!-- BACK -->

            <a
                href="#"
                class="back-home"
                id="backHome"
            >
                ← Back to PROJOYSTICK
            </a>

        </section>

    </main>


    <!-- AUTH JAVASCRIPT -->

    <script
        type="module"
        src="../js/auth.js"
    ></script>


    <!-- HOME LINK -->

    <script>

        /*
         * There is currently no index.html
         * in your project structure.
         *
         * Keep these links disabled until
         * you create the main store page.
         */

        document
            .getElementById("authLogo")
            ?.addEventListener(
                "click",
                event => {
                    event.preventDefault();
                }
            );


        document
            .getElementById("backHome")
            ?.addEventListener(
                "click",
                event => {
                    event.preventDefault();
                }
            );

    </script>

</body>

</html>
